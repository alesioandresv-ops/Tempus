name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: |
          cd backend
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Type check (critico)
        run: |
          cd backend
          .venv/bin/mypy app/core app/modules/auth

  migraciones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Create test database
        run: |
          docker compose exec -T postgres psql -U tempus_owner -d postgres -c "CREATE DATABASE tempus_test OWNER tempus_owner;" || true
          docker compose exec -T postgres psql -U tempus_owner -d postgres -c "CREATE USER tempus_app WITH PASSWORD 'tempus_app_dev_pw';" || true
          docker compose exec -T postgres psql -U tempus_owner -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE tempus_test TO tempus_owner;" || true
          docker compose exec -T postgres psql -U tempus_owner -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE tempus_test TO tempus_app;" || true
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://tempus_owner:tempus_owner_dev_pw@localhost:5433/tempus_test
          DATABASE_MIGRATION_URL: postgresql+asyncpg://tempus_owner:tempus_owner_dev_pw@localhost:5433/tempus_test
          JWT_SECRET_KEY: ci-test-jwt-secret-key-not-for-prod-32chars
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          SCHEDULER_TICK_SECRET: ci-test-scheduler-secret-not-for-prod
        run: |
          cd backend
          .venv/bin/alembic upgrade head
      - name: Verify migrations
        env:
          DATABASE_URL: postgresql+asyncpg://tempus_owner:tempus_owner_dev_pw@localhost:5433/tempus_test
          DATABASE_MIGRATION_URL: postgresql+asyncpg://tempus_owner:tempus_owner_dev_pw@localhost:5433/tempus_test
          JWT_SECRET_KEY: ci-test-jwt-secret-key-not-for-prod-32chars
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          SCHEDULER_TICK_SECRET: ci-test-scheduler-secret-not-for-prod
        run: |
          cd backend
          .venv/bin/alembic check
      - name: Teardown
        if: always()
        run: docker compose down -v

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Create test database
        run: |
          docker compose exec -T postgres psql -U tempus_owner -d postgres -c "CREATE DATABASE tempus_test OWNER tempus_owner;" || true
          docker compose exec -T postgres psql -U tempus_owner -d postgres -c "CREATE USER tempus_app WITH PASSWORD 'tempus_app_dev_pw';" || true
          docker compose exec -T postgres psql -U tempus_owner -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE tempus_test TO tempus_owner;" || true
          docker compose exec -T postgres psql -U tempus_owner -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE tempus_test TO tempus_app;" || true
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://tempus_owner:tempus_owner_dev_pw@localhost:5433/tempus_test
          DATABASE_MIGRATION_URL: postgresql+asyncpg://tempus_owner:tempus_owner_dev_pw@localhost:5433/tempus_test
          JWT_SECRET_KEY: ci-test-jwt-secret-key-not-for-prod-32chars
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          SCHEDULER_TICK_SECRET: ci-test-scheduler-secret-not-for-prod
        run: |
          cd backend
          .venv/bin/alembic upgrade head
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://tempus_owner:tempus_owner_dev_pw@localhost:5433/tempus_test
          TEST_DATABASE_URL: postgresql+asyncpg://tempus_app:tempus_app_dev_pw@localhost:5433/tempus_test
          DATABASE_MIGRATION_URL: postgresql+asyncpg://tempus_owner:tempus_owner_dev_pw@localhost:5433/tempus_test
          JWT_SECRET_KEY: ci-test-jwt-secret-key-not-for-prod-32chars
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          SCHEDULER_TICK_SECRET: ci-test-scheduler-secret-not-for-prod
        run: |
          cd backend
          .venv/bin/python -m pytest
      - name: Teardown
        if: always()
        run: docker compose down -v

  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Create test database
        run: |
          docker compose exec -T postgres psql -U tempus_owner -d postgres -c "CREATE DATABASE tempus_test OWNER tempus_owner;" || true
          docker compose exec -T postgres psql -U tempus_owner -d postgres -c "CREATE USER tempus_app WITH PASSWORD 'tempus_app_dev_pw';" || true
          docker compose exec -T postgres psql -U tempus_owner -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE tempus_test TO tempus_owner;" || true
          docker compose exec -T postgres psql -U tempus_owner -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE tempus_test TO tempus_app;" || true
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://tempus_owner:tempus_owner_dev_pw@localhost:5433/tempus_test
          DATABASE_MIGRATION_URL: postgresql+asyncpg://tempus_owner:tempus_owner_dev_pw@localhost:5433/tempus_test
          JWT_SECRET_KEY: ci-test-jwt-secret-key-not-for-prod-32chars
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          SCHEDULER_TICK_SECRET: ci-test-scheduler-secret-not-for-prod
        run: |
          cd backend
          .venv/bin/alembic upgrade head
      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
      - name: Teardown
        if: always()
        run: docker compose down -v
