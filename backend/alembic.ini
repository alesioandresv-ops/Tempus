[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os

# El formato de timestamp del nombre de archivo no se usa: las migraciones se
# nombran a mano (`0001_initial_schema.py`) para que el orden del repositorio
# coincida con el orden de aplicacion.
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url se deja vacio a proposito: lo injecta `migrations/env.py` desde
# la configuracion de la app, leyendo DATABASE_MIGRATION_URL. Poner la URL aca
# seria una credencial en un archivo commiteado (PROJECT_MASTER 42).
sqlalchemy.url =

[post_write_hooks]
# `type = module` y no `console_scripts`: Alembic arma `sys.executable -m ruff`,
# o sea el Ruff instalado en el **mismo** interprete que corre la migracion.
#
# Con `console_scripts` el hook no puede funcionar: ese tipo busca un entry point
# llamado `ruff` en el grupo `console_scripts`, y Ruff se distribuye como wheel
# binario, sin entry points de Python. El resultado era
# `ERROR Could not find entrypoint console_scripts.ruff` y el comando terminaba
# en FAILED **despues** de haber escrito el archivo de migracion, asi que el
# archivo quedaba sin formatear y el error quedaba scrollado en medio del log.
#
# `type = exec` tampoco servia: necesita `ruff` en el PATH, y con el venv sin
# activar se rompia en Windows.
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
