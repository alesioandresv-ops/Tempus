    <!--
      Iconos de la pestana. Se usa el isotipo de la marca (PNG con fondo
      transparente) apoyado sobre el fondo de marca: a 16 px los trazos finos del
      monograma no llegan a un pixel y quedan grises, y un fondo claro detras los
      deja aun menos visibles. El .ico trae 16/32/48 y el 512 es para Android y
      para quien instale la app.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-512.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0B1E2E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
